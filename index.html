<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#A53692">
<title>Bitácora Diaria · Diseñarte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app" class="app">
  <nav class="rail" id="rail" aria-label="Navegación principal">
    <div class="rail-brand">
      <img src="icons/icon-192.png" alt="Diseñarte" class="rail-logo" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'rail-logo-fallback',textContent:'D'}))">
      <span class="rail-brand-name">Bitácora</span>
    </div>
    <button class="rail-item" data-nav="hoy" type="button"><span class="ico" aria-hidden="true">today</span><span class="rail-label">Hoy</span></button>
    <button class="rail-item" data-nav="historial" type="button"><span class="ico" aria-hidden="true">history</span><span class="rail-label">Historial</span></button>
    <button class="rail-item" data-nav="perfil" type="button"><span class="ico" aria-hidden="true">person</span><span class="rail-label">Perfil</span></button>
  </nav>

  <main id="main" class="main" tabindex="-1"></main>

  <nav class="navbar" id="navbar" aria-label="Navegación principal">
    <button class="nav-dest" data-nav="hoy" type="button"><span class="nav-ind"><span class="ico" aria-hidden="true">today</span></span><span class="nav-label">Hoy</span></button>
    <button class="nav-dest" data-nav="historial" type="button"><span class="nav-ind"><span class="ico" aria-hidden="true">history</span></span><span class="nav-label">Historial</span></button>
    <button class="nav-dest" data-nav="perfil" type="button"><span class="nav-ind"><span class="ico" aria-hidden="true">person</span></span><span class="nav-label">Perfil</span></button>
  </nav>
</div>

<div id="sheet-root"></div>
<div id="snackbar-root" class="snackbar-root" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="app.js" type="module"></script>
</body>
</html>
