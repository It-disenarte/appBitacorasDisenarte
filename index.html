<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C07A6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bitácora">
<title>Bitácora · Diseñarte México</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.ico" sizes="48x48">
<link rel="icon" href="icons/hoja.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/hoja-apple-touch.png">
<link rel="preload" href="fonts/poppins-400-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/poppins-600-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="fonts/poppins.css">
<link rel="stylesheet" href="styles.css">
</head>
<body class="fondo-textura">
<!-- Pantallas sin sesión: entrar, configuración inicial y cambio de contraseña. -->
<div id="acceso" hidden></div>

<div id="app" class="app" hidden>
  <!-- Celular: barra superior morada con menú, marca y ayuda. -->
  <header class="appbar" id="appbar">
    <div class="appbar-fila">
      <button class="appbar-btn" id="menu-abrir" type="button" aria-label="Abrir el menú" aria-controls="sidebar" aria-expanded="false" data-guide="menu-boton">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12h16M4 6h16M4 18h16"/></svg>
      </button>
      <img src="icons/hoja-blanca.svg" alt="" width="30" height="30">
      <span class="appbar-nombre">Bitácora</span>
      <button class="appbar-btn" id="ayuda" type="button" aria-label="Ver guía de esta pantalla" title="Ver guía de esta pantalla" data-guide="ayuda">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
      </button>
    </div>
    <div class="filete appbar-filete"></div>
  </header>

  <div class="drawer-scrim" id="drawer-scrim"></div>

  <aside class="sidebar" id="sidebar" aria-label="Menú">
    <div class="sidebar-marca">
      <div class="marca" data-guide="menu-marca">
        <img src="icons/hoja-blanca.svg" alt="" width="44" height="44">
        <div>
          <div class="marca-nombre">Bitácora</div>
          <div class="marca-sub">Diseñarte México</div>
        </div>
      </div>
      <button class="appbar-btn sidebar-x" id="menu-cerrar" type="button" aria-label="Cerrar el menú">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="filete sidebar-filete"></div>

    <nav class="sidebar-nav" aria-label="Secciones" data-guide="menu-secciones">
      <button class="nav-item" data-nav="hoy" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg>Hoy
      </button>
      <button class="nav-item" data-nav="historial" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5M12 7v5l4 2"/></svg>Historial
      </button>
      <button class="nav-item" data-nav="perfil" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>Perfil
      </button>
      <button class="nav-item" data-nav="usuarios" type="button" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Usuarios
      </button>
    </nav>

    <div class="sidebar-label">Cuenta</div>
    <div class="sidebar-cuenta" data-guide="menu-cuenta">
      <button class="nav-item" id="sincronizar" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        Sincronizar
      </button>
      <button class="nav-item" id="cambiar-pass" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        Cambiar contraseña
      </button>
      <button class="nav-item" id="asistente-switch" type="button" role="switch" aria-checked="true">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/></svg>
        <span class="grow">Asistente de uso</span><span class="sw" aria-hidden="true"></span>
      </button>
      <button class="nav-item" id="ver-guia" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3M12 17h.01"/></svg>
        Ver guía de esta pantalla
      </button>
      <button class="nav-item" id="instalar" type="button" hidden>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5M12 15V3"/></svg>
        Instalar como app
      </button>
    </div>

    <div class="sidebar-pie" data-guide="menu-pie">
      <div class="pie-nombre" id="pie-nombre"></div>
      <div class="pie-rol" id="pie-area"></div>
      <div class="pie-estado" id="pie-estado"><span class="punto" aria-hidden="true"></span><span id="pie-estado-txt">Sincronizado</span></div>
      <button class="nav-item pie-salir" id="salir" type="button">
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg>
        Salir
      </button>
    </div>
  </aside>

  <main id="main" class="main" tabindex="-1"></main>
</div>

<div id="sheet-root"></div>
<div id="snackbar-root" class="snackbar-root" role="status" aria-live="polite"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
<script src="app.js" type="module"></script>
</body>
</html>
